apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-only
  namespace: ops
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]                # required to resolve the target Pod
- apiGroups: [""]
  resources: ["pods/exec"]      # separate resource — the subresource itself
  verbs: ["create"]             # exec IS a create against this subresource
