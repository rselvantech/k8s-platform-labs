apiVersion: v1
kind: Pod
metadata:
  name: dns-none-broken
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - "10.96.0.99"   # wrong — real CoreDNS is at 10.96.0.10
    searches:
      - default.svc.cluster.local
    options:
      - name: ndots
        value: "5"
  terminationGracePeriodSeconds: 0
  containers:
    - name: netshoot
      image: nicolaka/netshoot
      command: ["sleep", "3600"]
