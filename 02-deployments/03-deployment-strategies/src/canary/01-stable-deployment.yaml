apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-stable
  labels:
    app: nginx
spec:
  replicas: 4           # Stable version has more pods
  selector:
    matchLabels:
      app: nginx
      track: stable
  template:
    metadata:
      labels:
        app: nginx
        track: stable    # Stable label
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:latest
        args:
          - "-text=STABLE VERSION - v1.0"
          - "-listen=:5678"
        ports:
        - containerPort: 5678
